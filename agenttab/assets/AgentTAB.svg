<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>AgentTAB</title>
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"></rect>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"></stop>
      <stop offset="1" stop-color="#ece8db"></stop>
    </linearGradient>
    <linearGradient id="notch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d10"></stop>
      <stop offset="1" stop-color="#050507"></stop>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"></feGaussianBlur>
    </filter>
  </defs>

  <rect x="32" y="48" width="960" height="960" rx="230" ry="230" fill="#000" opacity="0.10" filter="url(#softShadow)"></rect>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"></rect>
    <rect x="3" y="3" width="1018" height="1018" rx="227" ry="227" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"></rect>

    <path d="M 358 0 L 666 0 L 666 240 Q 666 280 626 280 L 398 280 Q 358 280 358 240 Z" fill="url(#notch)"></path>
    <path d="M 360 2 L 664 2 L 664 14 L 360 14 Z" fill="#ffffff" opacity="0.06"></path>

    <text x="512" y="180" text-anchor="middle" font-family="ui-monospace, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="60" font-weight="500" fill="#7a7a82" xml:space="preserve">$ <tspan fill="#9ef0bb" font-weight="600">agent</tspan></text>
    <rect x="490" y="208" width="44" height="8" fill="#9ef0bb"></rect>

    <g transform="translate(120 410)">
      <circle cx="22" cy="22" r="22" fill="#3fb96b"></circle>
      <text x="68" y="36" font-family="ui-monospace, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="50" font-weight="700" fill="#1a1a1c">claude</text>
      <text x="784" y="36" text-anchor="end" font-family="ui-monospace, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="42" font-weight="500" fill="#7a766c">running</text>
    </g>

    <g transform="translate(120 540)">
      <circle cx="22" cy="22" r="22" fill="#4f86db"></circle>
      <text x="68" y="36" font-family="ui-monospace, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="50" font-weight="700" fill="#1a1a1c">codex</text>
      <text x="784" y="36" text-anchor="end" font-family="ui-monospace, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="42" font-weight="500" fill="#7a766c">2 tasks</text>
    </g>

    <g transform="translate(120 670)">
      <circle cx="22" cy="22" r="22" fill="#d97757"></circle>
      <text x="68" y="36" font-family="ui-monospace, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="50" font-weight="700" fill="#1a1a1c">repl</text>
      <text x="784" y="36" text-anchor="end" font-family="ui-monospace, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="42" font-weight="500" fill="#7a766c">idle</text>
    </g>

    <line x1="120" y1="500" x2="904" y2="500" stroke="#000" stroke-opacity="0.07" stroke-width="2"></line>
    <line x1="120" y1="630" x2="904" y2="630" stroke="#000" stroke-opacity="0.07" stroke-width="2"></line>

    <text x="512" y="900" text-anchor="middle" font-family="ui-monospace, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="36" font-weight="600" fill="#1a1a1c" letter-spacing="6">AGENT.TAB</text>
  </g>
</svg>