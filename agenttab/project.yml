# agenttab/project.yml
name: AgentTAB
options:
  bundleIdPrefix: com.roomss
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.roomss.agenttab
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  AgentTAB:
    type: application
    platform: macOS
    sources:
      - path: AgentTAB
        excludes:
          - "**/*.md"
          - "Resources/sounds/**"
          - "Resources/sounds"
      - path: AgentTAB/Resources/sounds
        type: folder
        buildPhase: resources
    resources:
      - path: AgentTAB/Resources/hook.sh
    dependencies:
      - package: Sparkle
    info:
      path: AgentTAB/App/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleName: AgentTAB
        CFBundleDisplayName: AgentTAB
        CFBundleIdentifier: com.roomss.agenttab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: "© Roomss Ltd"
        SUFeedURL: https://updates.agenttab.roomss.dev/appcast.xml
        SUPublicEDKey: PLACEHOLDER_INJECTED_AT_BUILD_TIME
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableInstallerLauncherService: true
    preBuildScripts:
      - name: "Inject Sparkle public key"
        script: |
          if [ -f "${SRCROOT}/sparkle-public-key.txt" ]; then
            KEY=$(cat "${SRCROOT}/sparkle-public-key.txt" | tr -d '[:space:]')
            INFOPLIST_PATH="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey ${KEY}" "${INFOPLIST_PATH}" 2>/dev/null || true
            echo "Injected Sparkle public key (${#KEY} chars)"
          else
            echo "warning: sparkle-public-key.txt not found — Sparkle updates won't verify"
          fi
        inputFiles:
          - $(SRCROOT)/sparkle-public-key.txt
    scheme:
      testTargets:
        - AgentTABTests
  AgentTABTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AgentTABTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AgentTAB
