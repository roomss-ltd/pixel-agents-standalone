# agenttab/project.yml
name: AgentTAB
options:
  bundleIdPrefix: com.roomss
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.roomss.agenttab
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  AgentTAB:
    type: application
    platform: macOS
    sources:
      - path: AgentTAB
        excludes:
          - "**/*.md"
    resources:
      - AgentTAB/Resources
    info:
      path: AgentTAB/App/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleName: AgentTAB
        CFBundleDisplayName: AgentTAB
        CFBundleIdentifier: com.roomss.agenttab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: "© Roomss Ltd"
    scheme:
      testTargets:
        - AgentTABTests
  AgentTABTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AgentTABTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AgentTAB
