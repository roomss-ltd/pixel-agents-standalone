# agenttab/project.yml
name: AgentTAB
options:
  bundleIdPrefix: com.roomss
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.roomss.agenttab
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  AgentTAB:
    type: application
    platform: macOS
    sources:
      - path: AgentTAB
        excludes:
          - "**/*.md"
          - "Resources/sounds/**"
          - "Resources/sounds"
      - path: AgentTAB/Resources/sounds
        type: folder
        buildPhase: resources
    resources:
      - path: AgentTAB/Resources/hook.sh
    dependencies:
      - package: Sparkle
    info:
      path: AgentTAB/App/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleName: AgentTAB
        CFBundleDisplayName: AgentTAB
        CFBundleIdentifier: com.roomss.agenttab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: "© Roomss Ltd"
        SUFeedURL: https://updates.agenttab.roomss.dev/appcast.xml
        SUPublicEDKey: PLACEHOLDER_INJECTED_AT_BUILD_TIME
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableInstallerLauncherService: true
    preBuildScripts:
      - name: "Embed matching Zellij client"
        script: |
          SOURCE="${SRCROOT}/../zellij-patched/target/release/zellij"
          DESTINATION="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/agenttab-zellij"
          if [ -x "$SOURCE" ]; then
            mkdir -p "$(dirname "$DESTINATION")"
            cp "$SOURCE" "$DESTINATION"
            chmod 755 "$DESTINATION"
          else
            rm -f "$DESTINATION"
            echo "warning: matching Zellij client not built; AgentTAB will use a safe system install"
          fi
    postBuildScripts:
      - name: "Inject Sparkle public key"
        script: |
          if [ ! -f "${SRCROOT}/sparkle-public-key.txt" ]; then
            echo "error: sparkle-public-key.txt missing — generate via Sparkle's generate_keys, see SPARKLE-KEYS.md" >&2
            exit 1
          fi
          KEY=$(cat "${SRCROOT}/sparkle-public-key.txt" | tr -d '[:space:]')
          if [ -z "$KEY" ]; then
            echo "error: sparkle-public-key.txt is empty" >&2
            exit 1
          fi
          INFOPLIST_PATH="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ -f "$INFOPLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey ${KEY}" "${INFOPLIST_PATH}"
            echo "Injected Sparkle public key (${#KEY} chars)"
          fi
        inputFiles:
          - $(SRCROOT)/sparkle-public-key.txt
    scheme:
      testTargets:
        - AgentTABTests
  AgentTABTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AgentTABTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AgentTAB
